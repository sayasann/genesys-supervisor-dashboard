<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supervisor Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      /* Arka Plan ve Paneller */
      --bg: #03040B;
      --panel: rgba(17, 19, 31, 0.75);
      --panel-hover: rgba(26, 29, 46, 0.95);
      --border: rgba(255, 255, 255, 0.2);
      --border-soft: rgba(255, 255, 255, 0.1);

      /* YENİ Metin Hiyerarşisi (Griler tamamen kaldırıldı, yerine parlak tonlar geldi) */
      --text: #FFFFFF;          /* Saf beyaz (Ana değerler için) */
      --text-dim: #F1F5F9;      /* Çok açık buz beyazı (İkincil metinler) */
      --text-faint: #7DD3FC;    /* Parlak açık mavi (Etiketler ve başlıklar için, okunaklı neon) */

      /* Durum Renkleri */
      --accent: #8B5CF6;
      --accent-dim: rgba(139, 92, 246, 0.2);

      --live: #10B981;
      --live-dim: rgba(16, 185, 129, 0.2);

      --warn: #FBBF24;
      --warn-dim: rgba(251, 191, 36, 0.2);

      --crit: #FB7185;
      --crit-dim: rgba(251, 113, 133, 0.2);

      --mono: 'IBM Plex Mono', monospace;
      --body: 'Inter', sans-serif;

      --radius: 20px;
      --radius-sm: 12px;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }

    body{
      background-color: var(--bg);
      background-image:
              radial-gradient(circle at 15% 0%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
              radial-gradient(circle at 85% 100%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--body);
      min-height: 100vh;
      padding: 40px 50px 80px;
      -webkit-font-smoothing: antialiased;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      gap:20px;
      margin-bottom:40px;
      padding: 20px 30px;
      background: var(--panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
    }
    .brand{ display:flex; align-items:center; gap:16px; }
    .brand-mark{
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #3B82F6);
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.4);
      display:flex; align-items:center; justify-content:center;
      font-family: var(--mono); font-weight:700; font-size:16px; color: #fff;
      flex-shrink:0;
    }
    .brand h1{
      font-weight:700; font-size: 20px; letter-spacing: -0.5px;
      color: #FFFFFF;
    }
    .brand .sub{ font-size:14px; color: var(--text-faint); margin-top:4px; font-weight:600;}

    .status-cluster{ display:flex; align-items:center; gap:30px; }
    .live-pill{
      display:flex; align-items:center; gap:10px;
      background: rgba(255,255,255,0.05);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid var(--border-soft);
      color: #FFFFFF;
      font-family: var(--mono);
      font-size:13px; font-weight:600; letter-spacing:0.5px;
    }
    .live-dot{
      width:8px; height:8px; border-radius:50%;
      background: var(--live);
      box-shadow: 0 0 12px var(--live);
      animation: breathe 2s ease-in-out infinite;
    }
    .live-dot.stale{ background: var(--warn); box-shadow: 0 0 12px var(--warn); animation:none; }
    .live-dot.down{ background: var(--crit); box-shadow: 0 0 12px var(--crit); animation:none; }
    @keyframes breathe{
      0%, 100%{ opacity: 1; transform: scale(1); }
      50%{ opacity: 0.4; transform: scale(0.85); }
    }

    .clock{ font-family: var(--mono); text-align:right; }
    #clockTime { font-size: 16px; font-weight: 700; color: #FFFFFF; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
    .clock .updated{ font-size:12px; color: var(--accent); margin-top:4px; font-weight: 600; }

    .summary{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .summary-card{
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 24px;
      transition: transform 0.3s ease, border-color 0.3s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .summary-card:hover {
      transform: translateY(-5px);
      border-color: var(--border);
    }
    .summary-card .label{
      font-size:13px; letter-spacing:0.5px; text-transform: uppercase;
      color: var(--text-faint); font-weight:700;
    }
    .summary-card .value{
      font-family: var(--mono); font-size:32px; font-weight:700;
      margin-top:12px; color: #FFFFFF;
      display:flex; align-items:center; gap:12px;
    }
    .summary-card .value .dot{
      width: 10px; height: 10px; border-radius: 50%;
      box-shadow: 0 0 12px currentColor;
    }

    .section-head{
      display:flex; align-items:center; justify-content:space-between;
      margin: 50px 0 20px;
      flex-wrap:wrap; gap:10px;
    }
    .section-head h2{
      font-size:18px; font-weight:700;
      letter-spacing:0.2px; color: #FFFFFF;
      display: flex; align-items: center; gap: 10px;
    }
    .section-head h2::before {
      content: ''; display: inline-block; width: 4px; height: 18px;
      background: var(--accent); border-radius: 4px;
      box-shadow: 0 0 10px var(--accent);
    }
    .section-head .hint{
      font-size:13px; color: var(--text-faint); font-family: var(--mono);
      background: rgba(125, 211, 252, 0.1); padding: 4px 10px; border-radius: 6px;
      font-weight: 600;
    }

    .empty-state{
      background: var(--panel);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 50px 20px;
      text-align:center;
      color: var(--text-dim);
      font-size:15px; font-weight: 500;
      font-family: var(--mono);
      grid-column: 1 / -1;
    }

    .queue-grid{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }
    .queue-card{
      background: linear-gradient(180deg, var(--panel) 0%, rgba(10,12,20,0.8) 100%);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 24px;
      transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .queue-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      opacity: 0; transition: opacity 0.3s;
    }
    .queue-card:hover{
      transform: translateY(-4px);
      border-color: var(--border);
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.6);
    }
    .queue-card:hover::before { opacity: 1; }

    .qc-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
    .qc-name{ font-size:17px; font-weight:700; color: #FFFFFF; letter-spacing: -0.2px;}
    .qc-status{
      display:flex; align-items:center; gap:8px;
      font-family: var(--mono); font-size:12px; font-weight:700; letter-spacing:0.5px;
      padding: 4px 10px; border-radius: 8px; text-transform: uppercase;
    }
    .qc-status .sdot{ width:6px; height:6px; border-radius:50%; box-shadow: 0 0 8px currentColor;}
    .qc-status.ok{ background: var(--live-dim); color: var(--live); }
    .qc-status.ok .sdot{ background: var(--live); }
    .qc-status.warn{ background: var(--warn-dim); color: var(--warn); }
    .qc-status.warn .sdot{ background: var(--warn); }
    .qc-status.crit{ background: var(--crit-dim); color: var(--crit); }
    .qc-status.crit .sdot{ background: var(--crit); }

    .qc-primary{ display:flex; gap:36px; margin-bottom:24px; }
    .qc-metric-big .num{ font-family: var(--mono); font-size:38px; font-weight:700; line-height:1; color: #FFFFFF; }
    .qc-metric-big .lbl{ font-size:13px; color: var(--text-faint); margin-top:10px; font-weight: 600;}

    .qc-gauge{ margin-bottom:24px; }
    .qc-gauge-track{
      height: 8px; border-radius: 8px; background: rgba(0,0,0,0.6);
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.8);
      position:relative; overflow:hidden;
    }
    .qc-gauge-fill{
      height:100%; border-radius:8px;
      transition: width 1s cubic-bezier(0.4, 0, 0.2, 1), background .3s ease;
      box-shadow: inset 0 0 8px rgba(255,255,255,0.5);
    }

    .qc-grid{
      display:grid; grid-template-columns: 1fr 1fr; gap:16px;
      padding-top:20px; border-top:1px solid var(--border-soft);
    }
    .qc-stat .num{ font-family: var(--mono); font-size:16px; font-weight:700; color: #FFFFFF; }
    .qc-stat .lbl{ font-size:12px; color: var(--text-faint); margin-top:4px; text-transform: uppercase; letter-spacing: 0.3px; font-weight: 700;}

    .agent-toolbar{
      display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;
    }
    .chip{
      font-family: var(--mono); font-size:13px; font-weight:600;
      padding: 8px 16px; border-radius: 20px;
      border: 1px solid var(--border-soft); color: var(--text-dim);
      background: rgba(255,255,255,0.05); cursor:pointer; user-select:none;
      transition: all .2s ease;
      display:flex; align-items:center; gap:8px;
    }
    .chip .dot{ width:6px; height:6px; border-radius:50%; box-shadow: 0 0 5px currentColor;}
    .chip.active{
      color: #FFFFFF;
      border-color: var(--accent);
      background: var(--accent-dim);
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.25);
    }
    .chip:hover:not(.active){ color: #FFFFFF; border-color: var(--border); background: rgba(255,255,255,0.1); }

    .agent-table-wrap{
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      overflow:hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    table.agent-table{ width:100%; border-collapse:collapse; }
    .agent-table thead th{
      text-align:left; font-size:12px; letter-spacing:1px; text-transform: uppercase;
      color: var(--text-faint); font-weight:700; padding:16px 24px;
      background: rgba(0,0,0,0.4);
      border-bottom: 1px solid var(--border-soft);
    }
    .agent-table tbody td{
      padding:16px 24px; font-size:15px; border-bottom:1px solid var(--border-soft);
      color: #FFFFFF; font-weight: 600;
    }
    .agent-table tbody tr:last-child td{ border-bottom:none; }
    .agent-table tbody tr{ transition: background .2s ease; }
    .agent-table tbody tr:hover{ background: rgba(255,255,255,0.06); }

    .agent-name{ display:flex; align-items:center; gap:14px; font-weight: 700;}
    .avatar{
      width:34px; height:34px; border-radius:10px;
      display:flex; align-items:center; justify-content:center;
      font-family: var(--mono); font-size:13px; font-weight:700;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
      color: #FFFFFF; border:1px solid var(--border-soft);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      flex-shrink:0;
    }

    .status-tag{
      display:inline-flex; align-items:center; gap:8px;
      font-family: var(--mono); font-size:13px; font-weight:700;
      padding: 6px 12px; border-radius: 20px;
      background: rgba(255,255,255,0.05);
    }
    .status-tag .sdot{ width:6px; height:6px; border-radius:50%; background:currentColor; box-shadow: 0 0 8px currentColor;}
    .status-tag.interacting{ color: var(--live); background: var(--live-dim); border: 1px solid rgba(16,185,129,0.3);}
    .status-tag.available{ color: var(--accent); background: var(--accent-dim); border: 1px solid rgba(139,92,246,0.3);}
    .status-tag.offqueue{ color: var(--text-dim); border: 1px solid var(--border-soft);}

    .queue-tags{ display:flex; flex-wrap:wrap; gap:8px; }
    .queue-tag{
      font-family: var(--mono); font-size:12px; color: var(--text-dim); font-weight: 600;
      background: rgba(0,0,0,0.5); border: 1px solid var(--border-soft);
      padding: 4px 10px; border-radius: 6px;
      transition: all 0.2s ease;
    }
    .queue-tag:hover {
      border-color: var(--border);
      color: #FFFFFF;
      background: rgba(0,0,0,0.7);
    }

    footer{
      margin-top:60px; text-align:center; font-size:13px; color: var(--text-dim); font-weight: 600;
      font-family: var(--mono); text-transform: uppercase; letter-spacing: 1px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    footer::before, footer::after {
      content: ''; height: 1px; width: 40px; background: var(--border-soft);
    }

    @media (max-width: 768px){
      body{ padding:20px 16px 40px; }
      .topbar { padding: 16px; flex-direction: column; align-items: flex-start;}
      .status-cluster { width: 100%; justify-content: space-between; }
      .qc-primary{ gap:20px; }
      .summary-card .value { font-size: 26px; }
    }

    @media (prefers-reduced-motion: reduce){
      .live-dot{ animation:none; }
      .queue-card{ transition: none; }
    }

    /* ---------- Auth gate (giriş kontrolü / oturum düşme ekranı) ---------- */
    .auth-gate{
      position: fixed;
      inset: 0;
      background-color: var(--bg);
      background-image:
              radial-gradient(circle at 15% 0%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
              radial-gradient(circle at 85% 100%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .auth-gate-card{
      text-align: center;
      max-width: 300px;
      background: var(--panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      padding: 36px 30px;
      box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
    }
    .auth-gate-dot{
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px var(--accent);
      margin: 0 auto 20px;
      animation: breathe 1.4s ease-in-out infinite;
    }
    .auth-gate-title{
      font-size: 15px; font-weight: 700; color: #FFFFFF;
      margin-bottom: 8px;
    }
    .auth-gate-sub{
      font-family: var(--mono); font-size:12.5px; color: var(--text-faint);
      letter-spacing: 0.3px; font-weight: 600;
    }
  </style>
</head>
<body>

<div class="auth-gate" id="authGate">
  <div class="auth-gate-card">
    <div class="auth-gate-dot"></div>
    <div class="auth-gate-title" id="authGateTitle">Oturum doğrulanıyor</div>
    <div class="auth-gate-sub" id="authGateSub">Genesys bağlantısı hazırlanıyor…</div>
  </div>
</div>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">SD</div>
    <div>
      <h1>Supervisor Dashboard</h1>
      <div class="sub">Çağrı merkezi operasyon görünümü</div>
    </div>
  </div>
  <div class="status-cluster">
    <div class="live-pill"><span class="live-dot" id="liveDot"></span> <span id="liveLabel">Bağlanıyor…</span></div>
    <div class="clock">
      <div id="clockTime">--:--:--</div>
      <div class="updated" id="updatedAgo">güncelleniyor…</div>
    </div>
  </div>
</div>

<div class="summary" id="summaryStrip"></div>

<div class="section-head">
  <h2>Kuyruklar</h2>
  <span class="hint">15 sn'de bir otomatik yenilenir</span>
</div>
<div class="queue-grid" id="queueGrid"></div>

<div class="section-head">
  <h2>Agent durumları</h2>
  <span class="hint" id="agentCountHint"></span>
</div>
<div class="agent-toolbar" id="agentFilters"></div>
<div class="agent-table-wrap">
  <table class="agent-table">
    <thead>
    <tr>
      <th>Agent</th>
      <th>Durum</th>
      <th>Kuyruklar</th>
    </tr>
    </thead>
    <tbody id="agentTableBody"></tbody>
  </table>
</div>

<footer id="footerLine">Genesys Cloud üzerinden canlı veri</footer>

<script>
  /* ============ SABİTLER ============ */
  const STATUS_META = {
    INTERACTING: { label: "Konuşuyor", cls: "interacting" },
    AVAILABLE:   { label: "Müsait",    cls: "available" },
    OFF_QUEUE:   { label: "Off queue", cls: "offqueue" },
  };

  /* ============ STATE ============ */
  let queues = [];
  let queueMeta = { stale: false, lastSuccessfulFetch: null };
  let agents = [];
  let agentCounts = { interactingCount: 0, availableCount: 0, offQueueCount: 0 };
  let agentMeta = { stale: false, lastSuccessfulFetch: null };
  let activeFilter = "all";
  let redirecting = false;

  /* ============ YARDIMCI ============ */
  function fmtSecToMin(s){
    const m = Math.floor(s/60), r = s%60;
    return `${m}:${String(r).padStart(2,'0')}`;
  }
  function initials(name){ return name.split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase(); }

  /* ============ AUTH GATE ============ */
  function showGate(title, sub){
    document.getElementById('authGateTitle').textContent = title;
    document.getElementById('authGateSub').textContent = sub;
    document.getElementById('authGate').style.display = 'flex';
  }
  function hideGate(){
    document.getElementById('authGate').style.display = 'none';
  }

  function goToLogin(){
    if(redirecting) return;
    redirecting = true;
    showGate('Oturum bulunamadı', 'Giriş sayfasına yönlendiriliyorsunuz…');
    setTimeout(() => { window.location.href = 'index.html'; }, 650);
  }

  /* ============ VERİ ÇEKME ============ */
  async function fetchQueueMetrics(){
    try{
      const res = await fetch('/api/queues/metrics', { credentials: 'include' });
      if(res.status === 401){ goToLogin(); return; }
      const body = await res.json();
      queues = body.queues || [];
      queueMeta = { stale: body.stale, lastSuccessfulFetch: body.lastSuccessfulFetch };
    }catch(e){
      queueMeta.stale = true;
    }
  }

  async function fetchAgentStatus(){
    try{
      const res = await fetch('/api/agents/status', { credentials: 'include' });
      if(res.status === 401){ goToLogin(); return; }
      const body = await res.json();
      agents = body.agents || [];
      agentCounts = {
        interactingCount: body.interactingCount || 0,
        availableCount: body.availableCount || 0,
        offQueueCount: body.offQueueCount || 0,
      };
      agentMeta = { stale: body.stale, lastSuccessfulFetch: body.lastSuccessfulFetch };
    }catch(e){
      agentMeta.stale = true;
    }
  }

  /* ============ RENDER ============ */
  function renderLiveStatus(){
    const dot = document.getElementById('liveDot');
    const label = document.getElementById('liveLabel');
    const hasAnyData = queues.length > 0 || agents.length > 0;

    dot.classList.remove('stale', 'down');

    if(!hasAnyData){
      dot.classList.add('down');
      label.textContent = 'Veri bekleniyor';
    } else if(queueMeta.stale || agentMeta.stale){
      dot.classList.add('stale');
      label.textContent = 'Bağlantı sorunu — son bilinen veri';
    } else {
      label.textContent = 'Canlı bağlantı';
    }

    const timestamps = [queueMeta.lastSuccessfulFetch, agentMeta.lastSuccessfulFetch].filter(Boolean);
    if(timestamps.length){
      const latest = new Date(Math.max(...timestamps.map(t => new Date(t).getTime())));
      const secondsAgo = Math.max(0, Math.round((Date.now() - latest.getTime()) / 1000));
      document.getElementById('updatedAgo').textContent = `${secondsAgo} sn önce güncellendi`;
    }
  }

  function renderSummary(){
    const totalWaiting = queues.reduce((s,q)=>s+q.waitingCalls,0);

    const cards = [
      { label:"Toplam bekleyen çağrı", value: totalWaiting, color:"var(--warn)" },
      { label:"Konuşuyor", value: agentCounts.interactingCount, color:"var(--live)" },
      { label:"Müsait", value: agentCounts.availableCount, color:"var(--accent)" },
      { label:"Off queue", value: agentCounts.offQueueCount, color:"#F1F5F9" },
    ];

    document.getElementById('summaryStrip').innerHTML = cards.map(c => `
    <div class="summary-card">
      <div class="label">${c.label}</div>
      <div class="value"><span class="dot" style="background:${c.color}; box-shadow: 0 0 12px ${c.color}"></span>${c.value}</div>
    </div>
  `).join('');
  }

  function queueState(q){
    if(q.waitingCalls >= 8 || q.abandonRate >= 0.07) return "crit";
    if(q.waitingCalls >= 4 || q.abandonRate >= 0.04) return "warn";
    return "ok";
  }

  function renderQueues(){
    const grid = document.getElementById('queueGrid');

    if(queues.length === 0){
      grid.innerHTML = `<div class="empty-state">Henüz kuyruk verisi yok — Genesys bağlantısı bekleniyor</div>`;
      return;
    }

    grid.innerHTML = queues.map(q => {
      const state = queueState(q);
      const badgeLabel = state === "crit" ? "Kritik" : state === "warn" ? "Dikkat" : "Normal";
      const gaugePct = Math.min(100, (q.waitingCalls/12)*100);
      const gaugeColor = state === "crit" ? "var(--crit)" : state === "warn" ? "var(--warn)" : "var(--live)";
      const abandonPct = (q.abandonRate * 100).toFixed(1);
      return `
    <div class="queue-card">
      <div class="qc-head">
        <div class="qc-name">${q.queueName}</div>
        <div class="qc-status ${state}"><span class="sdot"></span>${badgeLabel}</div>
      </div>
      <div class="qc-primary">
        <div class="qc-metric-big">
          <div class="num">${q.waitingCalls}</div>
          <div class="lbl">Bekleyen çağrı</div>
        </div>
        <div class="qc-metric-big">
          <div class="num">${q.talkingAgents}</div>
          <div class="lbl">Konuşan agent</div>
        </div>
      </div>
      <div class="qc-gauge">
        <div class="qc-gauge-track">
          <div class="qc-gauge-fill" style="width:${gaugePct}%; background:${gaugeColor};"></div>
        </div>
      </div>
      <div class="qc-grid">
        <div class="qc-stat"><div class="num">${q.dailyTotalCalls}</div><div class="lbl">Günlük toplam çağrı</div></div>
        <div class="qc-stat"><div class="num">${fmtSecToMin(q.avgWaitSeconds)}</div><div class="lbl">Ort. bekleme süresi</div></div>
        <div class="qc-stat"><div class="num">${fmtSecToMin(q.avgHandleSeconds)}</div><div class="lbl">Ort. handle time</div></div>
        <div class="qc-stat"><div class="num">%${abandonPct}</div><div class="lbl">Abandon oranı</div></div>
      </div>
    </div>`;
    }).join('');
  }

  function renderAgentFilters(){
    const counts = {
      all: agents.length,
      INTERACTING: agents.filter(a=>a.status==="INTERACTING").length,
      AVAILABLE: agents.filter(a=>a.status==="AVAILABLE").length,
      OFF_QUEUE: agents.filter(a=>a.status==="OFF_QUEUE").length,
    };
    const defs = [
      {key:"all", label:"Tümü", color:"#F1F5F9"},
      {key:"INTERACTING", label:STATUS_META.INTERACTING.label, color:"var(--live)"},
      {key:"AVAILABLE", label:STATUS_META.AVAILABLE.label, color:"var(--accent)"},
      {key:"OFF_QUEUE", label:STATUS_META.OFF_QUEUE.label, color:"#7DD3FC"},
    ];
    document.getElementById('agentFilters').innerHTML = defs.map(d => `
    <div class="chip ${activeFilter===d.key?'active':''}" data-key="${d.key}">
      <span class="dot" style="background:${d.color}; box-shadow: 0 0 8px ${d.color}"></span>${d.label} · ${counts[d.key]}
    </div>
  `).join('');
    document.querySelectorAll('.chip').forEach(el => {
      el.addEventListener('click', () => { activeFilter = el.dataset.key; renderAgentFilters(); renderAgentTable(); });
    });
  }

  function renderAgentTable(){
    const list = activeFilter === "all" ? agents : agents.filter(a=>a.status===activeFilter);
    document.getElementById('agentCountHint').textContent = `${list.length} agent gösteriliyor`;

    const body = document.getElementById('agentTableBody');
    if(agents.length === 0){
      body.innerHTML = `<tr><td colspan="3"><div class="empty-state">Henüz agent verisi yok — Genesys bağlantısı bekleniyor</div></td></tr>`;
      return;
    }

    body.innerHTML = list.map(a => {
      const meta = STATUS_META[a.status] || { label: a.status, cls: "offqueue" };
      const queueTags = (a.queueNames && a.queueNames.length)
              ? a.queueNames.map(q => `<span class="queue-tag">${q}</span>`).join('')
              : `<span class="queue-tag">—</span>`;
      return `
    <tr>
      <td><div class="agent-name"><div class="avatar">${initials(a.agentName)}</div>${a.agentName}</div></td>
      <td><span class="status-tag ${meta.cls}"><span class="sdot"></span>${meta.label}</span></td>
      <td><div class="queue-tags">${queueTags}</div></td>
    </tr>`;
    }).join('');
  }

  function renderAll(){
    renderLiveStatus();
    renderSummary();
    renderQueues();
    renderAgentFilters();
    renderAgentTable();
  }

  /* ============ SAAT ============ */
  function tickClock(){
    const now = new Date();
    document.getElementById('clockTime').textContent = now.toLocaleTimeString('tr-TR');
  }
  setInterval(() => { tickClock(); renderLiveStatus(); }, 1000);
  tickClock();

  /* ============ POLLING (backend scheduler'ıyla aynı ritimde, 15sn) ============ */
  let authConfirmed = false;

  async function refreshAll(){
    await Promise.all([fetchQueueMetrics(), fetchAgentStatus()]);
    if(redirecting) return;

    if(!authConfirmed){
      authConfirmed = true;
      hideGate();
    }
    renderAll();
  }

  refreshAll();
  setInterval(refreshAll, 15000);
</script>
</body>
</html>

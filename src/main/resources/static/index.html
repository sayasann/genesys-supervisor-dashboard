<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supervisor Dashboard — Giriş</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #050810;
    --panel: #0b1120;
    --panel-edge: #131c33;
    --neon: #2fd3ff;
    --neon-deep: #2e6bff;
    --neon-soft: rgba(47, 211, 255, 0.14);
    --text-primary: #eaf2ff;
    --text-muted: #5d7290;
    --text-dim: #34405c;
    --error: #ff4f6d;
    --error-soft: rgba(255, 79, 109, 0.12);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--void);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Arka plan: hafif grid + iki yumuşak neon glow */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(47, 211, 255, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(47, 211, 255, 0.045) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 40%, transparent 90%);
    pointer-events: none;
  }

  .glow-a, .glow-b {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
    opacity: 0.35;
  }
  .glow-a {
    width: 480px; height: 480px;
    background: var(--neon-deep);
    top: -180px; left: -120px;
  }
  .glow-b {
    width: 420px; height: 420px;
    background: var(--neon);
    bottom: -200px; right: -140px;
    opacity: 0.22;
  }

  .stage {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    padding: 24px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--text-primary);
    margin-bottom: 22px;
    justify-content: center;
  }

  .eyebrow .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--neon);
    box-shadow: 0 0 8px 2px var(--neon);
    animation: pulse-dot 2.2s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .card {
    background: linear-gradient(180deg, var(--panel), #080c18);
    border: 1px solid var(--panel-edge);
    border-radius: 18px;
    padding: 36px 32px 30px;
    position: relative;
    box-shadow:
      0 0 0 1px rgba(47, 211, 255, 0.05),
      0 30px 60px -20px rgba(0, 0, 0, 0.6),
      0 0 60px -18px rgba(47, 211, 255, 0.25);
  }

  .card::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 18px;
    padding: 1px;
    background: linear-gradient(135deg, rgba(47,211,255,0.5), rgba(47,211,255,0) 40%, rgba(47,211,255,0) 60%, rgba(46,107,255,0.4));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  /* İmza öğesi: canlı sinyal dalga formu */
  .waveform {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    height: 34px;
    margin-bottom: 20px;
  }

  .waveform span {
    display: block;
    width: 3px;
    border-radius: 2px;
    background: linear-gradient(180deg, var(--neon), var(--neon-deep));
    box-shadow: 0 0 6px rgba(47, 211, 255, 0.55);
    animation: wave 1.3s ease-in-out infinite;
  }

  .waveform span:nth-child(1)  { height: 30%; animation-delay: -1.1s; }
  .waveform span:nth-child(2)  { height: 55%; animation-delay: -0.9s; }
  .waveform span:nth-child(3)  { height: 85%; animation-delay: -0.7s; }
  .waveform span:nth-child(4)  { height: 45%; animation-delay: -0.5s; }
  .waveform span:nth-child(5)  { height: 100%; animation-delay: -0.35s; }
  .waveform span:nth-child(6)  { height: 40%; animation-delay: -1.2s; }
  .waveform span:nth-child(7)  { height: 70%; animation-delay: -0.15s; }
  .waveform span:nth-child(8)  { height: 32%; animation-delay: -0.6s; }
  .waveform span:nth-child(9)  { height: 60%; animation-delay: -1s; }
  .waveform span:nth-child(10) { height: 25%; animation-delay: -0.4s; }

  @keyframes wave {
    0%, 100% { transform: scaleY(0.35); opacity: 0.55; }
    50%      { transform: scaleY(1); opacity: 1; }
  }

  .title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 22px;
    text-align: center;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }

  .subtitle {
    text-align: center;
    font-size: 13px;
    color: var(--text-primary);
    margin: 0 0 30px;
  }

  form { display: flex; flex-direction: column; gap: 16px; }

  .field label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    color: var(--text-primary);
    margin-bottom: 7px;
    text-transform: uppercase;
  }

  .field input {
    width: 100%;
    background: #060a15;
    border: 1px solid var(--panel-edge);
    border-radius: 9px;
    padding: 12px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.18s, box-shadow 0.18s;
  }

  .field input::placeholder { color: var(--text-dim); }

  .field input:focus {
    border-color: var(--neon);
    box-shadow: 0 0 0 3px var(--neon-soft);
  }

  .field input.invalid {
    border-color: var(--error);
    box-shadow: 0 0 0 3px var(--error-soft);
  }

  button.submit {
    margin-top: 6px;
    background: linear-gradient(135deg, var(--neon), var(--neon-deep));
    border: none;
    border-radius: 9px;
    padding: 13px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    color: #051018;
    cursor: pointer;
    letter-spacing: 0.01em;
    box-shadow: 0 8px 24px -8px rgba(47, 211, 255, 0.55);
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
  }

  button.submit:hover { box-shadow: 0 10px 30px -6px rgba(47, 211, 255, 0.7); transform: translateY(-1px); }
  button.submit:active { transform: translateY(0); }
  button.submit:disabled { opacity: 0.55; cursor: default; transform: none; }

  .error-banner {
    display: none;
    align-items: center;
    gap: 8px;
    background: var(--error-soft);
    border: 1px solid rgba(255, 79, 109, 0.35);
    color: #ffb3c0;
    font-size: 12.5px;
    border-radius: 8px;
    padding: 10px 12px;
    animation: shake 0.35s ease;
  }

  .error-banner.show { display: flex; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-5px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(2px); }
  }

  .status-line {
    margin-top: 22px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.09em;
    color: var(--text-primary);
  }

  .status-line b { color: var(--text-primary); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    .waveform span, .eyebrow .dot, .error-banner { animation: none !important; }
  }
</style>
</head>
<body>

  <div class="glow-a"></div>
  <div class="glow-b"></div>

  <div class="stage">
    <div class="eyebrow"><span class="dot"></span> GENESYS LINK · SECURE</div>

    <div class="card">
      <div class="waveform">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>

      <h1 class="title">Supervisor Dashboard</h1>
      <p class="subtitle">Devam etmek için giriş yapın</p>

      <div id="errorBanner" class="error-banner">
        <span id="errorText">Kullanıcı adı veya şifre hatalı.</span>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="username">Kullanıcı adı</label>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="kullanici.adi" required>
        </div>
        <div class="field">
          <label for="password">Şifre</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="submit" id="submitBtn">Giriş yap</button>
      </form>

      <div class="status-line">OTURUM SÜRESİ · <b>30 DK</b></div>
    </div>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const submitBtn = document.getElementById('submitBtn');
  const errorBanner = document.getElementById('errorBanner');
  const errorText = document.getElementById('errorText');
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');

  // Backend'de dashboard'un asıl sayfasının dosya adı buysa değiştirmene gerek yok,
  // farklıysa (örn. index.html) bu tek satırı güncellemen yeterli.
  const DASHBOARD_URL = 'dashboard.html';

  function setInvalid(invalid) {
    usernameInput.classList.toggle('invalid', invalid);
    passwordInput.classList.toggle('invalid', invalid);
  }

  function showError(message) {
    errorText.textContent = message;
    errorBanner.classList.remove('show');
    void errorBanner.offsetWidth; // animasyonu yeniden tetiklemek için reflow
    errorBanner.classList.add('show');
    setInvalid(true);
  }

  form.addEventListener('input', () => {
    errorBanner.classList.remove('show');
    setInvalid(false);
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    submitBtn.disabled = true;
    submitBtn.textContent = 'Bağlanılıyor...';

    try {
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include', // httpOnly cookie'nin set edilebilmesi için şart
        body: JSON.stringify({
          username: usernameInput.value.trim(),
          password: passwordInput.value
        })
      });

      if (response.ok) {
        window.location.href = DASHBOARD_URL;
        return;
      }

      if (response.status === 401) {
        showError('Kullanıcı adı veya şifre hatalı.');
      } else {
        showError('Bir şeyler ters gitti, tekrar deneyin.');
      }
    } catch (err) {
      showError('Sunucuya ulaşılamıyor, bağlantını kontrol et.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Giriş yap';
    }
  });
</script>

</body>
</html>

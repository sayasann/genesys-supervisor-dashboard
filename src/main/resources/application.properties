spring.application.name=dashboard

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
genesys.client-id=${GENESYS_CLIENT_ID}
genesys.client-secret=${GENESYS_CLIENT_SECRET}
genesys.region= ${REGION}
genesys.division= ${DIVISION}

jwt.secret = ${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.time-zone=Europe/Istanbul

spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never
